name: OMC CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: OMC TDD Gate (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 셸 의존 테스트(test_omc_pipeline_check_exit, test_omc_post_file_check)는
      # macOS mktemp --suffix 이슈 + 호스트 환경 의존성으로 ubuntu-latest에서 제외
      - name: Run unit tests (shell-independent)
        run: |
          python3 -m pytest scripts/ -q \
            --ignore=scripts/test_omc_pipeline_check_exit.py \
            --ignore=scripts/test_omc_post_file_check.py \
            --ignore=scripts/test_omc_pipeline_check_gemini.py

      - name: OMC TDD Gate (omc_tdd_check)
        shell: bash
        env:
          OMC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OMC_PUSH_BEFORE_SHA: ${{ github.event.before }}
          OMC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          OMC_TDD_BASE=""

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            OMC_TDD_BASE="$OMC_PR_BASE_SHA"
          elif [[ -n "$OMC_PUSH_BEFORE_SHA" && "$OMC_PUSH_BEFORE_SHA" != "$ZERO_SHA" ]]; then
            OMC_TDD_BASE="$OMC_PUSH_BEFORE_SHA"
          elif [[ -n "$OMC_DEFAULT_BRANCH" ]]; then
            OMC_TDD_BASE="$(git rev-parse "origin/$OMC_DEFAULT_BRANCH" 2>/dev/null || true)"
          fi

          if [[ -z "$OMC_TDD_BASE" ]] || ! git cat-file -e "${OMC_TDD_BASE}^{commit}" 2>/dev/null; then
            echo "::error::OMC TDD base commit could not be resolved"
            exit 1
          fi

          if [[ "$OMC_TDD_BASE" == "$(git rev-parse HEAD)" ]]; then
            OMC_TDD_BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [[ -z "$OMC_TDD_BASE" ]]; then
              echo "::error::OMC TDD requires a parent commit for the initial default-branch push"
              exit 1
            fi
          fi

          python3 scripts/omc_tdd_check.py --base "$OMC_TDD_BASE"

  test-shell:
    name: OMC Shell Hook Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ubuntu에서 제외한 셸 의존 테스트 3개를 macOS에서 실행
      # (mktemp /tmp/ 형식 사용 — macOS/Linux 공통 호환)
      - name: Run shell-dependent tests
        run: |
          python3 -m pytest \
            scripts/test_omc_pipeline_check_exit.py \
            scripts/test_omc_post_file_check.py \
            scripts/test_omc_pipeline_check_gemini.py \
            -v
